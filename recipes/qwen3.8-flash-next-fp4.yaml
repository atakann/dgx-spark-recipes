# Qwen3.8-Flash-Next-FP4-Local (NVIDIA's QAD NVFP4), NVIDIA's DGX Spark command from the model card. One DGX Spark.
# Measured 2026-10-23: JSON 62, code 58, explain 47, rewrite 44 tok/s (one user, temperature 0.7, MTP 4).
