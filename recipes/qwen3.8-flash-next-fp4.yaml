type: server
image: dgx-spark-recipes/vllm-flash-next:8244d1c
build: images/vllm-flash-next
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
revision: b9ce18a6887e18c089fdea8509a33e63429a3300
memory: 112g
cache: true
io_uring: true
args: {model} --served-model-name qwen3.8-flash-next --tensor-parallel-size 1 --mamba-cache-mode align --enable-prefix-caching --enable-chunked-prefill --dtype bfloat16 --kv-cache-dtype fp8 --quantization modelopt_mixed --block-size 16 --load-format b12x --max-model-len 262144 --max-num-seqs 8 --max-num-batched-tokens 4096 --speculative-config {"method":"mtp","num_speculative_tokens":4} --gdn-decode-kernel b12x --linear-backend b12x --moe-backend b12x --no-enable-flashinfer-autotune --mm-encoder-tp-mode data --reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice --compilation-config {"pass_config":{"fuse_act_quant":true}} --gpu-memory-utilization 0.8
