# Ornith-1.5-122B-A10B, the lab's Q4_K_M GGUF, on llama.cpp built for the GB10 (sm_121). One DGX Spark.
# Measured 2026-10-20: decode 28.2 tok/s (one user, warm), 8k-token prompt in 8.5 s, about 80 GiB in use.
# The prebuilt llama.cpp CUDA image stops at sm_120 and decodes this model at 1.8 tok/s on the GB10.
type: server
image: dgx-spark-recipes/llama-cpp:v0.7.0-sm121
build: images/llama-cpp
model: ornith-ai/Ornith-1.5-122B-GGUF
revision: 5514dc9eb187cb71eb3b1089716fbe1bdd7e7a7d
file: Ornith-1.5-122B-Q4_K_M.gguf
memory: 105g
args: -m {model} --alias ornith -ngl 999 -c 65536 -fa on --jinja -np 1 --load-mode none --fit off
