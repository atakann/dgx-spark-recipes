# NVIDIA Nemotron 3.5 Super VL 120B-A12B NVFP4 (vision-language, Mamba-2 + MoE + attention) with NVIDIA's LiLiCorr
# DFlash draft, 7 tokens, on vLLM 0.32.0. One DGX Spark.
# Measured 2026-11-03 from a clean start of this recipe, one user, thinking off, temperature 0.7: JSON 71, code 64,
# rewrite 62, explain 45, story 30 tok/s; decode 33 tok/s at 32K context and 29 at 128K (lab run); a document page
# image read and answered in 5.5 s. NVIDIA's DGX Spark command from the model card, with two changes
# that keep 10+ GiB free: 0.70 of the memory instead of 0.75 (0.75 dipped to 8.5 GiB in the first start's MoE
# autotune) and a 256K window (the default 1M needs 10 GiB of KV cache that 0.70 does not leave). Lowest free memory
# 20.2 GiB from a clean start (17.8 in the lab). --trust-remote-code: vLLM's own config for this model lacks fields that the repo's config code adds; the
# repo's 8 .py files at this revision were read (config and image processing; no network, subprocess or file writes).
# The first start autotunes kernels (ready about 12 min after the command); one sequence, as in NVIDIA's Spark command.
