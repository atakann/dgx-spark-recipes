# Qwen3.8-Flash-Next-FP4-Local on two DGX Sparks, TP=2 over the QSFP link: NVIDIA's vLLM cluster playbook command
# ("Qwen3.8 Flash-Next on two 64GB Sparks"), on the same image as the one-Spark recipe. Run it on the first Spark
# with WORKER=<ssh host of the second Spark>; the image and the model are copied to the worker by --setup.
# Measured 2026-10-25: JSON 98, code 95, rewrite 75, explain 74 tok/s (one user, temperature 0.7, MTP 4, median of 5);
# first start 10 min, at least 29 GiB stayed free on each Spark.
# Changed from NVIDIA's command: up to 32 images a request instead of 1, so an agent can look at several screenshots.
type: server
sparks: 2
image: dgx-spark-recipes/vllm-flash-next:8244d1c
build: images/vllm-flash-next
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
revision: b9ce18a6887e18c089fdea8509a33e63429a3300
memory: 112g
cache: true
io_uring: true
env: VLLM_ENABLE_ROCE_ALLREDUCE=1 VLLM_ROCE_ALLREDUCE_MAX_SIZE=2MB NCCL_BUFFSIZE=1048576 NCCL_MAX_CTAS=8 B12X_WEIGHTS_COMPILE_WORKERS=4 B12X_STATE_COMPILE_WORKERS=4 B12X_BIND_COMPILE_WORKERS=4
args: {model} --served-model-name qwen3.8-flash-next --tensor-parallel-size 2 --mamba-cache-mode align --enable-prefix-caching --enable-chunked-prefill --dtype bfloat16 --kv-cache-dtype fp8 --quantization modelopt_mixed --block-size 16 --load-format b12x --max-model-len 262144 --max-num-seqs 8 --max-num-batched-tokens 2048 --speculative-config {"method":"mtp","num_speculative_tokens":4} --gdn-decode-kernel b12x --linear-backend b12x --moe-backend b12x --no-enable-flashinfer-autotune --mm-encoder-tp-mode data --reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice --compilation-config {"pass_config":{"fuse_act_quant":true},"max_cudagraph_capture_size":40,"cudagraph_capture_sizes":[1,2,4,5,8,10,16,20,24,32,40]} --mm-processor-cache-gb 0 --limit-mm-per-prompt {"image":32} --gpu-memory-utilization 0.8 --kv-cache-memory-bytes 3G
