# Qwen3.8-27B BF16 with Tencent's DSpine draft (5 layers, 16 tokens per block), on SGLang 0.5.22. One DGX Spark.
# DSpine's plugin needs FA3, which the GB10 does not have: images/dspine applies gb10.patch (Triton draft attention).
# Tencent's Qwen3.8-27B command with Triton attention, 0.70 of the memory and no --trust-remote-code.
# Measured 2026-11-09 from a clean start, one user, temperature 0.7, 300 tokens, thinking off, best of 5: JSON 30.5,
# code 30.6, rewrite 29.0, explain 16.3, story 8.0 tok/s (lab: z-lab's DFlash2 23.4, 23.6, 19.2, 18.6, 10.3; no draft 4.5).
# Ready 10.3 min after the command, lowest free memory 21.6 GiB. Greedy answers matched no draft on 4 of 6 prompts
# (near-tie token choices on the other two); DFlash2 matched on 6 of 6. FlashInfer as the draft backend gave garbage.
type: server
image: dgx-spark-recipes/dspine:0cc92d8-gb10
build: images/dspine
model: Qwen/Qwen3.8-27B
revision: 37561816e66b5b9153b1b64c10968c18c1e6f4a0
draft: tencent/Qwen3.8-27B-DSpine-b16
draft_revision: 5f54174d301dbca65d9aa4448dc47e56732d9a12
memory: 112g
args: --model-path {model} --served-model-name qwen3.8-27b --tp-size 1 --dtype bfloat16 --attention-backend triton --linear-attn-backend triton --mamba-ssm-dtype float32 --mamba-radix-cache-strategy extra_buffer --max-mamba-cache-size 64 --mem-fraction-static 0.70 --context-length 131072 --max-running-requests 8 --cuda-graph-max-bs-decode 8 --sampling-backend flashinfer --reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-metrics --speculative-algorithm DSPINE --speculative-num-draft-tokens 16 --speculative-draft-attention-backend triton --speculative-draft-model-path {draft} --enable-linear-replayssm-spec --min-free-slots-delay 1
